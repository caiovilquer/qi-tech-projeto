<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Sequência financeira: ordem e atomicidade</title><desc id="desc">Validar acesso e reservar chave na mesma transação. No conflito ler novamente e comparar para replay. Nova operação Pix trava cliente antes das contas. Todas as contas são travadas por ID crescente com NO KEY UPDATE. Ler valores frescos e obter horário após locks, validar, atualizar saldos e inserir entries, depois commit. Resposta incerta exige mesma chave.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#51645b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#20372e}.link{fill:none;stroke:#51645b;stroke-width:2}.arrow{marker-end:url(#arrow)}</style><rect x="10" y="8" width="210" height="37" fill="#e5efe9" stroke="#8ca597"/><text x="22" y="34" font-size="20" font-weight="bold">Integrador</text><rect x="345" y="8" width="265" height="37" fill="#e5efe9" stroke="#8ca597"/><text x="357" y="34" font-size="20" font-weight="bold">API / controller</text><rect x="745" y="8" width="205" height="37" fill="#e5efe9" stroke="#8ca597"/><text x="757" y="34" font-size="20" font-weight="bold">PostgreSQL</text><path d="M115 45V413M475 45V413M845 45V413" fill="none" stroke="#8ca597" stroke-dasharray="5 5"/><path class="link arrow" d="M115 81H475"/><text x="130" y="70" font-size="18">POST · chave por intenção</text><text x="488" y="103" font-size="18">Formato, autenticação, acesso e contas</text><path class="link arrow" d="M475 139H845"/><text x="488" y="127" font-size="18">INSERT reserva · UNIQUE(cliente, chave)</text><rect x="240" y="152" width="710" height="81" fill="#f6f8f7" stroke="#8ca597"/><text x="254" y="174" font-size="18" font-weight="bold">CONFLITO: SELECT separado após esperar o vencedor</text><path class="link arrow" d="M475 217H115"/><text x="15" y="202" font-size="17">201 replay / 409 conflito</text><text x="488" y="203" font-size="17">Compara tipo, modalidade, contas, valor</text><text x="488" y="225" font-size="17">Não revalida saldo, estado, tarifa ou quota</text><rect x="240" y="247" width="710" height="157" fill="#f6f8f7" stroke="#8ca597"/><text x="254" y="270" font-size="18" font-weight="bold">NOVA: mesma transação; locks FOR NO KEY UPDATE</text><path class="link arrow" d="M475 306H845"/><text x="488" y="292" font-size="18">Pix: cliente → contas por ID crescente</text><text x="488" y="325" font-size="17">Leitura fresca + hora; validar estado/saldo/quota</text><path class="link arrow" d="M475 363H845"/><text x="488" y="350" font-size="17">UPDATE relativo + RETURNING; entries; COMMIT</text><path class="link arrow" d="M475 393H115"/><text x="15" y="383" font-size="17">201 após commit confirmado</text><text x="488" y="391" font-size="17">Principal antes da tarifa; ID sob lock</text><rect x="10" y="426" width="940" height="74" fill="#fbf1dc" stroke="#8ca597"/><text x="23" y="448" font-size="18">Recusa antes do commit: rollback completo, incluindo a reserva de chave.</text><text x="23" y="470" font-size="18">Confirmação perdida: resultado desconhecido (503/QIT001027 quando possível).</text><text x="23" y="492" font-size="18">Reenviar mesma chave e conteúdo. Reserva não é dinheiro confirmado; replay não cobra de novo.</text></svg>