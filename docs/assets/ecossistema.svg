<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Ecossistema do protótipo</title><desc id="desc">Um integrador de backend declara identidade à API. API e instância de teste api-fee0 usam PostgreSQL. MockServer simula bureau. Testes acessam negócio somente por HTTP; não consultam banco diretamente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#51645b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#20372e}.link{fill:none;stroke:#51645b;stroke-width:2}.arrow{marker-end:url(#arrow)}</style><rect x="10" y="10" width="280" height="98" fill="#fff" stroke="#8ca597"/><rect x="10" y="10" width="280" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="22" y="35" font-size="20" font-weight="bold">Integrador confiável</text><text x="22" y="69" font-size="16">Token interno + contexto de cliente</text><text x="22" y="93" font-size="16">Autentica usuário / representante PJ</text><rect x="360" y="10" width="275" height="98" fill="#fff" stroke="#8ca597"/><rect x="360" y="10" width="275" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="372" y="35" font-size="20" font-weight="bold">api · FastAPI</text><text x="372" y="69" font-size="16">Cadastro, contas e movimentação</text><text x="372" y="93" font-size="16">PF/PJ · tarifa por modalidade</text><rect x="705" y="10" width="245" height="98" fill="#fff" stroke="#8ca597"/><rect x="705" y="10" width="245" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="717" y="35" font-size="20" font-weight="bold">PostgreSQL 16</text><text x="717" y="69" font-size="16">5 entidades; volume</text><text x="717" y="93" font-size="16">Saldo, locks e histórico</text><rect x="10" y="195" width="280" height="98" fill="#fff" stroke="#8ca597"/><rect x="10" y="195" width="280" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="22" y="220" font-size="20" font-weight="bold">pytest · perfil test</text><text x="22" y="254" font-size="16">Setup e asserts por HTTP</text><text x="22" y="278" font-size="16">Sem SQL / Docker socket</text><rect x="360" y="195" width="275" height="98" fill="#fff" stroke="#8ca597"/><rect x="360" y="195" width="275" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="372" y="220" font-size="20" font-weight="bold">api-fee0 · perfil test</text><text x="372" y="254" font-size="16">Mesma imagem / mesmo banco</text><text x="372" y="278" font-size="16">Todas as tarifas: zero</text><rect x="705" y="195" width="245" height="98" fill="#fff" stroke="#8ca597"/><rect x="705" y="195" width="245" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="717" y="220" font-size="20" font-weight="bold">MockServer</text><text x="717" y="254" font-size="16">Bureau de abertura</text><text x="717" y="278" font-size="16">Cenários determinísticos</text><path class="link arrow" d="M290 65H360"/><text x="302" y="53" font-size="15">HTTP</text><path class="link arrow" d="M635 65H705"/><text x="654" y="53" font-size="15">SQL</text><path class="link arrow" d="M290 250H360"/><text x="302" y="238" font-size="15">HTTP</text><path class="link arrow" d="M330 250V110H360"/><path class="link arrow" d="M635 250H661V108H705"/><text x="636" y="181" font-size="15">SQL</text><path class="link arrow" d="M590 108V152H830V195"/><text x="718" y="141" font-size="16">HTTP bureau</text><path class="link arrow" d="M635 280H705"/><text x="645" y="270" font-size="15">HTTP</text><text x="10" y="342" font-size="18">A consulta ao bureau não mantém transação SQL aberta. Mock também disponível no sandbox.</text><text x="10" y="371" font-size="18">Pix é local/simulado. Não há SPI/DICT, fila, worker ou microsserviço de negócio.</text></svg>