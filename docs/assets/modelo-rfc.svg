<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Modelo de dados da RFC: cinco entidades</title><desc id="desc">Cliente possui contas e solicita operações. Conta possui histórico de estados e lançamentos. Operação contém uma a três entradas, destino obrigatório e origem somente para transferência.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#51645b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#20372e}.link{fill:none;stroke:#51645b;stroke-width:2}.arrow{marker-end:url(#arrow)}</style><rect x="10" y="10" width="390" height="119" fill="#fff" stroke="#8ca597"/><rect x="10" y="10" width="390" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="22" y="35" font-size="20" font-weight="bold">customer</text><text x="22" y="69" font-size="18">id PK · customer_key UNIQUE · PF/PJ</text><text x="22" y="92" font-size="18">document_number · name · email?</text><text x="22" y="115" font-size="18">Unicidade tipo/documento e criação</text><rect x="555" y="10" width="395" height="119" fill="#fff" stroke="#8ca597"/><rect x="555" y="10" width="395" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="567" y="35" font-size="20" font-weight="bold">account</text><text x="567" y="69" font-size="17">id PK · account_key UNIQUE · customer_id FK</text><text x="567" y="92" font-size="17">balance_cents · status · status_version</text><text x="567" y="115" font-size="17">Unicidade e pedido original de criação</text><path class="link" d="M400 68H555"/><text x="432" y="54" font-size="18">1 : 0..N</text><rect x="10" y="239" width="390" height="146" fill="#fff" stroke="#8ca597"/><rect x="10" y="239" width="390" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="22" y="264" font-size="20" font-weight="bold">operation</text><text x="22" y="298" font-size="17">id PK · operation_key UNIQUE · customer_id FK</text><text x="22" y="322" font-size="17">type · modality · origem? FK · destino FK</text><text x="22" y="346" font-size="17">amount_cents · fee_cents · created_at</text><text x="22" y="370" font-size="17">UNIQUE(customer_id, idempotency_key)</text><rect x="555" y="239" width="395" height="122" fill="#fff" stroke="#8ca597"/><rect x="555" y="239" width="395" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="567" y="264" font-size="20" font-weight="bold">account_status_event</text><text x="567" y="298" font-size="17">account_id FK · version · anterior? → novo</text><text x="567" y="322" font-size="17">reason · actor · created_at · evidência bureau?</text><text x="567" y="346" font-size="17">UNIQUE(account_id, version)</text><rect x="555" y="421" width="395" height="122" fill="#fff" stroke="#8ca597"/><rect x="555" y="421" width="395" height="36" fill="#e5efe9" stroke="#8ca597"/><text x="567" y="446" font-size="20" font-weight="bold">account_entry</text><text x="567" y="480" font-size="17">operation_id FK · account_id FK · entry_key</text><text x="567" y="504" font-size="17">role · delta_cents · balance_after_cents</text><text x="567" y="528" font-size="17">created_at · UNIQUE(operation_id, role)</text><path class="link" d="M70 129V239"/><text x="84" y="189" font-size="18">1 : 0..N</text><path class="link" d="M755 129V239"/><text x="770" y="189" font-size="18">1 : 1..N</text><path class="link" d="M570 129V158H420V214H380V239"/><text x="227" y="182" font-size="17">Destino 1; origem 0..1</text><path class="link" d="M400 329H460V465H555"/><text x="468" y="448" font-size="18">1 : 1..3</text><path class="link" d="M939 129H957V404H902V421"/><text x="720" y="406" font-size="17">Conta 1 : 0..N entries</text><text x="10" y="566" font-size="18">BRL / centavos BIGINT · FKs restritivas · instantes UTC · IDs internos não são expostos.</text><text x="10" y="593" font-size="18">Saldo + entries + operação: um commit. Estado + evento: um commit. Sem token pessoal.</text></svg>