name: qit-banking
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-sandbox-integrator-only}
  MONITORING_TOKEN: ${MONITORING_TOKEN:-sandbox-monitoring-only}
  INTEGRATOR_ID: bootcamp-integrator
  APP_ENV: ${APP_ENV:-sandbox}
  SANDBOX_DEPOSITS: ${SANDBOX_DEPOSITS:-true}
  BUREAU_URL: http://bureau:1080
  TEST_CLOCK: ${TEST_CLOCK:-}
  FEE_PF_INTERNAL: ${FEE_PF_INTERNAL:-200}
  FEE_PJ_INTERNAL: ${FEE_PJ_INTERNAL:-500}
  FEE_PF_PIX_SIMULATED: ${FEE_PF_PIX_SIMULATED:-0}
  FEE_PJ_PIX_SIMULATED: ${FEE_PJ_PIX_SIMULATED:-100}
  PIX_DAY_LIMIT: ${PIX_DAY_LIMIT:-1000000}
  PIX_NIGHT_LIMIT: ${PIX_NIGHT_LIMIT:-100000}
x-api: &api
  build:
    context: .
    target: api
  environment: *api-env
  command: [uvicorn, app:app, --host, 0.0.0.0, --port, '3000', --no-server-header, --no-access-log]
  healthcheck:
    test: [CMD-SHELL, "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
    interval: 3s
    timeout: 5s
    retries: 30
  depends_on:
    db:
      condition: service_healthy
    bureau:
      condition: service_started
services:
  api:
    <<: *api
    ports: ['127.0.0.1:${API_PORT:-3000}:3000']
  api-fee0:
    <<: *api
    profiles: [test]
    environment:
      <<: *api-env
      FEE_PF_INTERNAL: '0'
      FEE_PJ_INTERNAL: '0'
      FEE_PF_PIX_SIMULATED: '0'
      FEE_PJ_PIX_SIMULATED: '0'
  db:
    build: ./database
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    volumes: [bank-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U bootcamp -d bootcamp']
      interval: 3s
      timeout: 3s
      retries: 30
  bureau:
    image: mockserver/mockserver:5.15.0
    environment:
      MOCKSERVER_LOG_LEVEL: WARN
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/bureau.json
    volumes: ['./config/bureau.json:/config/bureau.json:ro']
  runner:
    build:
      context: .
      target: runner
    profiles: [test]
    environment:
      API_URL: http://api:3000
      FEE0_URL: http://api-fee0:3000
      BUREAU_URL: http://bureau:1080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-sandbox-integrator-only}
      MONITORING_TOKEN: ${MONITORING_TOKEN:-sandbox-monitoring-only}
    depends_on:
      api:
        condition: service_healthy
      api-fee0:
        condition: service_healthy
volumes:
  bank-data:
